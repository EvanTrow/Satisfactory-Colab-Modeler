<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satisfactory Colab Modeler</title>
    <meta
      name="description"
      content="Plan Satisfactory factories on an infinite canvas with exact rational arithmetic, then edit them together."
    />
    <!--
      Open Graph / Twitter card tags so links pasted into Discord, Slack,
      etc. show a rich preview instead of a bare URL. og:url/og:image are
      placeholders — update both here to the real production domain once
      a hosting provider is chosen.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Satisfactory Colab Modeler" />
    <meta property="og:title" content="Satisfactory Colab Modeler" />
    <meta
      property="og:description"
      content="Plan Satisfactory factories on an infinite canvas with exact rational arithmetic, then edit them together."
    />
    <meta property="og:url" content="https://satisfactory-modeler.trowbridge.tech/" />
    <meta property="og:image" content="https://satisfactory-modeler.trowbridge.tech/og-image.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Satisfactory Colab Modeler" />
    <meta
      name="twitter:description"
      content="Plan Satisfactory factories on an infinite canvas with exact rational arithmetic, then edit them together."
    />
    <meta name="twitter:image" content="https://satisfactory-modeler.trowbridge.tech/og-image.png" />
    <!--
      Job 014: applies the persisted/system theme class to <html> before
      React ever mounts, so there's no flash-of-wrong-theme between first
      paint and `theme/useTheme.ts`'s own (otherwise-idempotent) first
      effect run. Mirrors that hook's `resolveInitialTheme` logic exactly —
      keep the two in sync if the storage key or fallback ever changes.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("scm-theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.classList.toggle("light", !dark);
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
